name: Release

# A release tag gets a GitHub release, once CI has passed (ci.yml calls this). The tag
# must agree with the version in the sources; the notes list the fixes and features
# committed since the previous tag. The release carries packages for Fedora, Debian,
# Ubuntu and Arch Linux. Run by hand, it publishes a tag pushed before this workflow
# existed.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.3
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    name: Check the version and write the notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # The notes need the history back to the previous tag.
          fetch-depth: 0
      - name: Check the version and write the notes
        run: |
          mkdir -p notes
          python3 - <<'EOF'
          import os, re, subprocess, sys

          def grep(path, pattern):
              with open(path) as f:
                  return path, re.search(pattern, f.read()).group(1)

          tag = os.environ["TAG"].removeprefix("v")
          found = [
              grep("src/ripple/_version.py", r"__version__ = \"(.*)\""),
          ]
          wrong = [f"{where} says {v}" for where, v in found if v != tag]
          if wrong:
              sys.exit(f"The tag is {tag}, but " + ", ".join(wrong))

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout.strip()

          previous = git("describe", "--tags", "--abbrev=0", os.environ["TAG"] + "^")
          span = f"{previous}..{os.environ['TAG']}" if previous else os.environ["TAG"]
          subjects = git("log", "--no-merges", "--format=%s", span).splitlines()
          picked = [s for s in subjects if re.match(r"(feat|fix|perf)(\(.*\))?!?:", s)] or [
              s for s in subjects if not re.match(r"(chore|ci)(\(.*\))?!?:", s)
          ]
          notes = ["\n".join(f"- {s}" for s in picked)]
          with open("notes/notes.md", "w") as f:
              f.write("\n\n".join(notes) + "\n")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes/notes.md

  fedora:
    name: Package for Fedora
    needs: source
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the tools
        run: dnf install -y --setopt=install_weak_deps=False git-core rpm-build dnf-plugins-core
      # The spec of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          spec=packaging/fedora/ripple.spec
          sed -i "s/^Version:.*/Version:        ${TAG#v}/; s/^Release:.*/Release:        1%{?dist}/" "$spec"
          dnf builddep -y --setopt=install_weak_deps=False "$spec"
          # rpmbuild fetches Source0 from the tag into a directory it does not create itself.
          mkdir -p rpmbuild/SOURCES
          # The image lists /usr/sbin, the same directory on Fedora, before /usr/bin; pip would
          # write /usr/sbin/python3 into the ripple script, which no package provides.
          export PATH=/usr/bin:$PATH
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "_disable_source_fetch 0" "$spec"
          mkdir dist && mv rpmbuild/RPMS/*/*.rpm dist/
          # The dependencies resolve on the release it was built for.
          dnf install -y dist/*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora
          path: dist/*

  debian:
    name: Package for ${{ matrix.name }}
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Testing, as for the GTK applications.
          - name: Debian
            image: debian:forky
            artifact: debian
            revision: "1"
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            artifact: ubuntu
            revision: 1~ubuntu26.04
    container: ${{ matrix.image }}
    env:
      REVISION: ${{ matrix.revision }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev \
            python3 python3-pip python3-setuptools python3-wheel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          python3 -m pip wheel --no-build-isolation --no-deps -w wheel .
          # Debian's layout, /usr/lib/python3/dist-packages, rather than its pip's /usr/local.
          DEB_PYTHON_INSTALL_LAYOUT=deb python3 -m pip install --no-deps --no-index --no-compile \
            --root stage --prefix /usr wheel/ripple-*.whl
          install -Dm644 LICENSE stage/usr/share/doc/ripple/copyright
      - name: Package
        run: |
          bins=()
          for f in $(find stage -type f); do
            readelf -h "$f" >/dev/null 2>&1 && bins+=("$f")
          done
          arch=all shlibs=
          if [ ${#bins[@]} -gt 0 ]; then
            arch=$(dpkg --print-architecture)
            strip --strip-unneeded "${bins[@]}"
            # dpkg-shlibdeps wants a source package to belong to.
            mkdir debian
            printf 'Source: ripple\n\nPackage: ripple\nArchitecture: any\n' > debian/control
            shlibs=$(dpkg-shlibdeps -O $(printf -- '-e %s ' "${bins[@]}") | sed -n 's/^shlibs:Depends=//p')
          fi
          mkdir stage/DEBIAN
          cat > stage/DEBIAN/control <<EOF
          Package: ripple
          Version: ${TAG#v}-$REVISION
          Architecture: $arch
          Maintainer: sachesi <xsachesi@pm.me>
          Installed-Size: $(du -sk stage | cut -f1)
          Depends: ${shlibs:+$shlibs, }python3 (>= 3.10)
          Section: games
          Priority: optional
          Homepage: https://github.com/sachesi/ripple
          Description: Download and install Proton releases with centralized storage
           ripple is a CLI tool to download and install Proton builds into one central
           store, then symlink them into Steam, Bottles, and Lutris paths.
          EOF
          mkdir dist
          deb="dist/ripple_${TAG#v}-${REVISION}_$arch.deb"
          dpkg-deb --root-owner-group -Zxz --build stage "$deb"
          # The dependencies resolve on the release it was built for.
          apt-get install -y "./$deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  arch:
    name: Package for Arch Linux
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The PKGBUILD of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          pacman -Syu --noconfirm --needed git
          useradd -m builder
          install -d -o builder pkg
          cp packaging/aur/PKGBUILD pkg/
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" pkg/PKGBUILD
          (source pkg/PKGBUILD && pacman -S --noconfirm --needed --asdeps "${depends[@]}" "${makedepends[@]}")
          su builder -c 'cd pkg && makepkg --noconfirm'
          name=$(source pkg/PKGBUILD && echo "$pkgname")
          mkdir dist && mv pkg/"$name-${TAG#v}"-1-*.pkg.tar.zst dist/
          # The dependencies resolve on Arch as it is today.
          pacman -U --noconfirm dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: dist/*

  publish:
    name: Publish the release
    needs: [source, fedora, debian, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: notes
          name: notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{fedora,debian,ubuntu,arch}"
          merge-multiple: true
      - name: Publish
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          # A release that already exists keeps its notes, which may have been edited by hand.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "Ripple ${TAG#v}" \
              --notes-file ../notes/notes.md *
          fi
